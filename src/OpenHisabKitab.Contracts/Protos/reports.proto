syntax = "proto3";
package ohk.v1;
option csharp_namespace = "OpenHisabKitab.Contracts.V1";

import "common.proto";

service Reports {
  rpc TrialBalance (PeriodRequest) returns (TrialBalanceMsg);
  rpc ProfitAndLoss (PeriodRequest) returns (ProfitAndLossMsg);
  rpc BalanceSheet (AsAtRequest) returns (BalanceSheetMsg);
  rpc LedgerStatement (StatementRequest) returns (StatementMsg);
  rpc BalanceSheetLayout (LayoutAsAtRequest) returns (LayoutMsg);
  rpc ProfitAndLossLayout (LayoutPeriodRequest) returns (LayoutMsg);
  rpc CashFlow (PeriodRequest) returns (CashFlowMsg);
  rpc LedgerStatementPage (StatementPageRequest) returns (StatementPageMsg);
}

message PeriodRequest { int32 company = 1; Period period = 2; }
message AsAtRequest { int32 company = 1; string as_at = 2; }
message StatementRequest { int32 company = 1; int32 ledger = 2; Period period = 3; }

message TrialBalanceRowMsg { int32 ledger = 1; int64 opening = 2; int64 debits = 3; int64 credits = 4; int64 closing = 5; }
message TrialBalanceMsg {
  Period period = 1;
  repeated TrialBalanceRowMsg rows = 2;
  int64 opening_difference = 3;
  int64 total_debit = 4;
  int64 total_credit = 5;
}
message ReportRowMsg { int32 ledger = 1; int64 amount = 2; }
message ProfitAndLossMsg {
  Period period = 1;
  repeated ReportRowMsg income = 2;
  repeated ReportRowMsg expenses = 3;
  int64 total_income = 4;
  int64 total_expenses = 5;
  int64 net_profit = 6;
}
message BalanceSheetMsg {
  string as_at = 1;
  repeated ReportRowMsg assets = 2;
  repeated ReportRowMsg liabilities = 3;
  int64 current_profit = 4;
  int64 opening_difference = 5;
  int64 total_assets = 6;
  int64 total_liabilities = 7;
}
message StatementRowMsg { string date = 1; int64 voucher_id = 2; int64 amount = 3; int64 balance = 4; }
message StatementMsg { int32 ledger = 1; Period period = 2; int64 opening = 3; repeated StatementRowMsg rows = 4; int64 closing = 5; }

// style: "ScheduleIII" or "Chart"; empty means ScheduleIII. previous is filled only when has_previous is set.
// group and ledger are 0 when the line has none.
message LayoutAsAtRequest { int32 company = 1; string as_at = 2; string style = 3; }
message LayoutPeriodRequest { int32 company = 1; Period period = 2; string style = 3; }
message LayoutLineMsg { string side = 1; string kind = 2; int32 depth = 3; string label = 4; int32 group = 5; int32 ledger = 6;
  int64 current = 7; int64 previous = 8; }
message LayoutMsg { string style = 1; bool has_previous = 2; repeated LayoutLineMsg lines = 3; }
message CashFlowLineMsg { string section = 1; string item = 2; int32 group = 3; int64 amount = 4; }
message CashFlowMsg { Period period = 1; repeated CashFlowLineMsg lines = 2; int64 operating = 3; int64 investing = 4;
  int64 financing = 5; int64 net_change = 6; int64 opening_cash = 7; int64 closing_cash = 8; }
message StatementPageRequest { int32 company = 1; int32 ledger = 2; Period period = 3; PageMsg page = 4; }
// counter_ledgers: the voucher's other ledgers, largest amount first.
message StatementLineMsg { string date = 1; int64 voucher_id = 2; string type = 3; string number = 4; string narration = 5;
  int64 amount = 6; int64 balance = 7; repeated int32 counter_ledgers = 8; }
// opening: the balance before this page's first line. closing: the statement's closing, on every page. next is empty on the last page.
message StatementPageMsg { int32 ledger = 1; Period period = 2; int64 opening = 3; repeated StatementLineMsg lines = 4;
  int64 closing = 5; string next = 6; }
